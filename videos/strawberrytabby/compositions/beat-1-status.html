<template id="beat-1-status-template">
  <div data-composition-id="beat-1-status" data-width="1920" data-height="1080" data-start="0" data-duration="3.4">
    <style>
      @font-face{font-family:Chirp;src:url('capture/assets/fonts/Chirp-Regular.c88864db.latin.woff2')}@font-face{font-family:Chirp;src:url('capture/assets/fonts/Chirp-Light.190dbce4.latin.woff2');font-weight:300}
      [data-composition-id="beat-1-status"]{width:100%;height:100%;background:#FFFFFF;overflow:hidden;font-family:Chirp,Arial,sans-serif;color:#0F141A}
      .scene{width:100%;height:100%;padding:90px 180px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;position:relative}
      .rail{position:absolute;top:0;bottom:0;width:1px;background:#E4EAEC}.rail.left{left:30.2%}.rail.right{right:30.2%}
      .shot{width:980px;height:552px;object-fit:cover;object-position:center center;opacity:.24;border:1px solid #E4EAEC;box-shadow:0 14px 38px rgba(15,20,26,.08)}
      .copy{position:absolute;display:flex;flex-direction:column;align-items:center;gap:18px;background:rgba(255,255,255,.92);padding:34px 60px}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#52636F}.title{font-size:72px;line-height:1;font-weight:800;letter-spacing:-.04em}.rule{width:140px;height:5px;background:#1D9BF0;border-radius:3px}
    </style>
    <div class="scene"><div class="rail left"></div><div class="rail right"></div><img class="shot" src="capture/screenshots/scroll-000.png" /><div class="copy"><div class="eyebrow">Profile status</div><div class="title">Unavailable</div><div class="rule"></div></div></div>
    <script>
      window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
      tl.fromTo('.rail',{scaleY:0,transformOrigin:'center top'},{scaleY:1,duration:.6,ease:'power2.out'},0);
      tl.fromTo('.shot',{y:18,opacity:0,scale:1.02},{y:0,opacity:.24,scale:1,duration:.8,ease:'power2.out'},.15);
      tl.fromTo('.copy',{y:18,opacity:0},{y:0,opacity:1,duration:.65,ease:'power3.out'},.55);
      tl.fromTo('.rule',{scaleX:0,transformOrigin:'left center'},{scaleX:1,duration:.45,ease:'power2.out'},1.35);
      tl.to('.rule',{scaleX:1.16,duration:.5,yoyo:true,repeat:1,ease:'sine.inOut'},2.1);
      window.__timelines['beat-1-status']=tl;
    </script>
  </div>
</template>
