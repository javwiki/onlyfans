[project]
site_name = "OnlyFans / Adult Model / NSFW Webcam Girl 索引"
site_url = "https://javwiki.github.io/onlyfans/"
site_description = "OnlyFans、成人模特与 NSFW webcam girl 公开创作者资料索引。"
repo_url = "https://github.com/javwiki/onlyfans"
repo_name = "javwiki/onlyfans"
edit_uri = "edit/main/docs/"
use_directory_urls = true

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# Follow the user's system color preference by default.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[project.plugins.tags]
